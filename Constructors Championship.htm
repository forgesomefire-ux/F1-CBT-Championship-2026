<style>
body {
  background-color: #0D0D0D;

}
.button {
    background-color: #7A0909;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    border-bottom: 3px solid #695F5F;
    border-top: 3px solid #695F5F;
    border-left: 3px solid #695F5F;
    border-right: 3px solid #695F5F;
    border-radius: 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    transition: 0.2s;
  display: inline-block;
    margin-top: 15px;
    margin-bottom: 20px;
}

.button:hover {
    background-color: #D1D1D1;
color: black;
  border-bottom: 3px solid #7A0909;
    border-top: 3px solid #7A0909;
    border-left: 3px solid #7A0909;
    border-right: 3px solid #7A0909;
}

.active {
    background-color: #D1D1D1;
    color: black;
}
table {
  border-collapse: collapse;
  width: 100%;
}
td, th {
  border: 1px solid #555;
  text-align: middle;
  padding: 10px;
  color: white;
}

th {
  background-color: #000;
}
  tr td:nth-child(2) {
width: 100px;
text-align: center;
}
tr:first-child {
    font-family: 'Rajdhani', sans-serif;
    font-size:20px;

}
tr:nth-child(even) {
  background-color: #222;
}

tr:nth-child(odd) {
  background-color: #111;
}
td:last-child,
th:last-child {
    text-align: center;
}
td:hover {
    background-color: #444;
transition: all 0.2s ease;
transform: scale(1.008);
  box-shadow: 0 0 12px #E10600;

}
tr:not(:first-child) {
    transition: transform 0.2s ease;
}

tr:not(:first-child):hover {
    transform: translateX(8px);
}
h1 {
    color: white;
    transition: 0.3s;
}

h1:hover {
    color: #A8A8A8;
}
h1 {
 letter-spacing: 2px;
    border-bottom: 3px solid #E10600;
    padding-bottom: 10px;
    display: inline-block;
font-family: 'Michroma', sans-serif;

}
